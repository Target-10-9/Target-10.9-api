name: CI/CD dev (Lambda image via OIDC)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

# Nécessaire pour OIDC
permissions:
  id-token: write
  contents: read

# Paramètres ENV (modifie si besoin)
env:
  AWS_REGION: eu-west-3
  ACCOUNT_ID: "180344875125"
  ECR_REPO: target109-api
  IMAGE_TAG: dev
  API_FUNCTION: target109-api-dev
  MIGRATOR_FUNCTION: target109-api-migrator-dev
  # Chemin où se trouve le Dockerfile (adapter si différent)
  WDIR: Target-10.9-api

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/GitHubActionsTarget109Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image (linux/amd64)
        id: build
        working-directory: ${{ env.WDIR }}
        run: |
          set -euo pipefail
          REPO_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}

          # Build en manifest Docker v2 (compatible Lambda), mono-arch amd64, et push vers ECR
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t "$REPO_URI:${{ env.IMAGE_TAG }}" \
            --push .

          # Récupère le dernier digest poussé pour ce tag (sécurisé par tri sur imagePushedAt)
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPO }}" \
            --image-ids imageTag="${{ env.IMAGE_TAG }}" \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' \
            --output text)

          echo "repo_uri=$REPO_URI" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update Lambda code (API) + move alias "dev"
        id: lambda_api
        run: |
          set -euo pipefail
          IMAGE="${{ steps.build.outputs.repo_uri }}@${{ steps.build.outputs.digest }}"

          # Met à jour le code et publie une nouvelle version
          VERSION=$(aws lambda update-function-code \
            --function-name "${{ env.API_FUNCTION }}" \
            --image-uri "$IMAGE" \
            --publish \
            --query 'Version' \
            --output text)

          # Pointe l'alias "dev" vers cette version
          aws lambda update-alias \
            --function-name "${{ env.API_FUNCTION }}" \
            --name dev \
            --function-version "$VERSION"

          echo "api_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Lambda code (Migrator)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.build.outputs.repo_uri }}@${{ steps.build.outputs.digest }}"
          aws lambda update-function-code \
            --function-name "${{ env.MIGRATOR_FUNCTION }}" \
            --image-uri "$IMAGE"

      - name: Summary
        if: always()
        run: |
          echo "### Déploiement dev terminé ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.build.outputs.repo_uri }}@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda API version**: \`${{ steps.lambda_api.outputs.api_version }}\` (alias \`dev\` mis à jour)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swagger**: https://6vus3nwkx9.execute-api.eu-west-3.amazonaws.com/dev/swagger" >> $GITHUB_STEP_SUMMARY
