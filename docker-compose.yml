version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: target10_postgres
    restart: always
    environment:
      POSTGRES_USER: target_user
      POSTGRES_PASSWORD: target_password
      POSTGRES_DB: target_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - target10net

volumes:
  postgres_data:

networks:
  target10net:
    driver: bridge
